name: RAG Service CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ihab0/rag-service

jobs:

  ci:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Display GitHub context
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Ref type: ${{ github.ref_type }}"
          echo "Commit: ${{ github.sha }}"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw


      - name: Build application
        run: ./mvnw package -DskipTests

      - name: Display generated files
        run: ls -lah target

      - name: Upload application JAR
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1


  docker:
    name: Publish Docker image

    needs:
      - ci

    if: >
      github.event_name == 'push' &&
      github.ref_type == 'tag'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Télécharge le JAR produit dans le job CI.
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Display downloaded JAR
        run: ls -lah target

      - name: Extract and validate version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          echo "Git tag: ${GITHUB_REF_NAME}"
          echo "Docker version: ${VERSION}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: ${VERSION}"
            echo "Expected format: v1.0.0"
            exit 1
          fi

          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate short commit SHA
        id: commit
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "value=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Short SHA: ${SHORT_SHA}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify version does not already exist
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          IMAGE="${IMAGE_NAME}:${VERSION}"

          echo "Checking Docker image: ${IMAGE}"

          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "Docker image ${IMAGE} already exists."
            echo "Create a new version."
            exit 1
          fi

          echo "Version ${VERSION} is available."

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.commit.outputs.value }}
          labels: |
            org.opencontainers.image.title=rag-service
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SHORT_SHA: ${{ steps.commit.outputs.value }}
        run: |
          echo "## Docker image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE_NAME}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit image: \`${IMAGE_NAME}:sha-${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"