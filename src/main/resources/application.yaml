spring:
  application:
    name: rag-service

  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}

  cloud:
    config:
      enabled: true
      label: main
    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}

        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.2

        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            model: gemini-embedding-001
            task-type: RETRIEVAL_DOCUMENT
            dimensions: 768

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        table-name: vector_store
        schema-name: public
        max-document-batch-size: 100

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:micro-service}
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:micro-service}/protocol/openid-connect/certs

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:cvs}

server:
  port: 8094

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.ai: INFO
    recruitment.dev.ragservice: INFO
